# Weekly update PRs, grouped so they stay few. CI must be green before merging.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/, /ops/backup]
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: terraform
    directories: [/infra/terraform/azure, /infra/terraform/bootstrap-azure, /infra/terraform/dns]
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
