# Weekly update PRs, grouped so they stay few. CI must be green before merging.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/, /ops/backup]
    schedule: { interval: weekly, day: monday }
    ignore:
      # Node: majors by hand, LTS lines only (22 now, 24 next); never odd releases like 23 or 25.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # pg_dump must match the managed PostgreSQL major (17): a newer dump cannot be restored on it.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
  - package-ecosystem: terraform
    directories: [/infra/terraform/azure, /infra/terraform/bootstrap-azure, /infra/terraform/dns]
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
