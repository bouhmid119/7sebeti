name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    # Fails the PR if a key, token or password is committed (the repository is public).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hsebeti
          POSTGRES_PASSWORD: hsebeti
          POSTGRES_DB: hsebeti
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hsebeti" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://hsebeti:hsebeti@localhost:5432/hsebeti
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migrations apply on a fresh database
        run: pnpm db:migrate
      - name: Tests (unit + RLS + API against Postgres)
        run: pnpm test
      - run: pnpm build
      - name: Schema and migrations are in sync
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/db/migrations

  image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hsebeti
          POSTGRES_PASSWORD: hsebeti
          POSTGRES_DB: hsebeti
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hsebeti" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Production compose file is valid
        run: cp ops/deploy/.env.example ops/deploy/.env && docker compose -f ops/deploy/compose.yml config -q
      - name: Build the app image
        run: docker build --build-arg APP_VERSION=${{ github.sha }} -t hsebeti:ci .
      - name: Build the backup image
        run: docker build -t hsebeti-backup:ci ops/backup
      - name: Smoke test (migrate, then api /health)
        run: |
          ENV="-e DATABASE_URL=postgres://hsebeti:hsebeti@localhost:5432/hsebeti
               -e BETTER_AUTH_SECRET=$(openssl rand -base64 32)
               -e ENCRYPTION_KEY=v1:$(openssl rand -base64 32)
               -e DATA_MASTER_KEY=v1:$(openssl rand -base64 32)
               -e API_URL=http://localhost:4000
               -e RESEND_API_KEY=re_ci_smoke_test"
          docker run --rm --network host $ENV hsebeti:ci migrate
          docker run -d --name api --network host $ENV hsebeti:ci api
          for i in $(seq 1 20); do curl -fsS localhost:4000/health && exit 0; sleep 1; done
          docker logs api; exit 1

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
      - name: Format
        run: terraform fmt -check -recursive infra/terraform
      - name: Validate every root (no backend, nothing applied)
        run: |
          for root in bootstrap-azure azure dns; do
            echo "::group::$root"
            terraform -chdir=infra/terraform/$root init -backend=false -input=false
            terraform -chdir=infra/terraform/$root validate
            echo "::endgroup::"
          done
