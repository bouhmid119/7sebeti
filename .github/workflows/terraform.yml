name: Terraform

# Infrastructure (infra/terraform/azure and dns):
#   pull request  → plan, read-only identity, result in the run summary;
#   push on main  → plan then apply, in the "beta-infra" environment, which waits for Ahmed's approval.
# No secret for Azure (GitHub OIDC). Cloudflare token and private variables are environment
# secrets. Setup (once): docs/cicd.md. Until AZURE_CLIENT_ID_PLAN exists, jobs are skipped.
on:
  pull_request:
    paths: ['infra/**', '.github/workflows/terraform.yml']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/terraform.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  ARM_USE_OIDC: 'true'
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  BACKEND: >-
    -backend-config=resource_group_name=${{ vars.TF_STATE_RG }}
    -backend-config=storage_account_name=${{ vars.TF_STATE_ACCOUNT }}
    -backend-config=container_name=tfstate

jobs:
  plan:
    # Pull requests from forks get no OIDC token: plan only runs for branches of this repository.
    if: >-
      github.event_name == 'pull_request' && vars.AZURE_CLIENT_ID_PLAN != '' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_PLAN }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_ssh_public_key: ${{ vars.TF_SSH_PUBLIC_KEY }}
      TF_VAR_ssh_allowed_cidrs: ${{ secrets.TF_SSH_ALLOWED_CIDRS }}
      TF_VAR_alert_emails: ${{ secrets.TF_ALERT_EMAILS }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Plan azure (read-only, no state lock)
        working-directory: infra/terraform/azure
        run: |
          terraform init $BACKEND
          terraform plan -lock=false -no-color | tee plan.txt
          { echo '### terraform plan (azure)'; echo '```'; grep -E '^(Plan:|No changes|  # )' plan.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  apply:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.AZURE_CLIENT_ID_INFRA != ''
    runs-on: ubuntu-latest
    environment: beta-infra
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_INFRA }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_ssh_public_key: ${{ vars.TF_SSH_PUBLIC_KEY }}
      TF_VAR_ssh_allowed_cidrs: ${{ secrets.TF_SSH_ALLOWED_CIDRS }}
      TF_VAR_alert_emails: ${{ secrets.TF_ALERT_EMAILS }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Apply azure
        working-directory: infra/terraform/azure
        run: |
          terraform init $BACKEND
          terraform plan -no-color -out=tfplan > plan.txt
          { echo '### terraform apply (azure)'; echo '```'; grep -E '^(Plan:|No changes|  # )' plan.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          terraform apply -no-color tfplan
          echo "API_IP=$(terraform output -raw vm_public_ip)" >> "$GITHUB_ENV"
      - name: Apply dns (api.7sebeti.com → VM)
        working-directory: infra/terraform/dns
        env:
          TF_VAR_api_ip: ${{ env.API_IP }}
        run: |
          terraform init $BACKEND
          terraform apply -no-color -auto-approve
