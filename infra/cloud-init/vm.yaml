#cloud-config
# Same first boot for every provider (Azure for the beta, Scaleway at stage 1):
# swap, Docker, firewall, automatic security updates, SSH by key only, deploy files.
# Rendered by Terraform: ${admin_user} and ${swap_mb}.

package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - git
  - ufw
  - unattended-upgrades

write_files:
  - path: /etc/ssh/sshd_config.d/10-sebeti.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no

runcmd:
  # Swap: the beta VM has 1 GB of RAM.
  - [sh, -c, 'if [ ! -f /swapfile ]; then fallocate -l ${swap_mb}M /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo "/swapfile none swap sw 0 0" >> /etc/fstab; fi']
  # Docker Engine + Compose plugin.
  - [sh, -c, 'curl -fsSL https://get.docker.com | sh']
  - [usermod, -aG, docker, '${admin_user}']
  # Host firewall in addition to the provider's: SSH, HTTP, HTTPS only.
  - [ufw, default, deny, incoming]
  - [ufw, allow, 22/tcp]
  - [ufw, allow, 80/tcp]
  - [ufw, allow, 443/tcp]
  - [ufw, --force, enable]
  - [dpkg-reconfigure, -f, noninteractive, unattended-upgrades]
  - [systemctl, reload, ssh]
  # Deployment files only (ops/); .env is filled by hand over SSH, never by Terraform.
  - [sudo, -u, '${admin_user}', git, clone, --depth, '1', 'https://github.com/bouhmid119/7sebeti.git', '/home/${admin_user}/7sebeti']
