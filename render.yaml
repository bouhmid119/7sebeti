# Render Blueprint — API + worker + Postgres in Frankfurt.
# The web app is a static site on Cloudflare Pages (see docs/deploy.md).
databases:
  - name: sebeti-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: '17'

services:
  - type: web
    name: sebeti-api
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @7sebeti/api build
    preDeployCommand: pnpm db:migrate
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    domains: [api.7sebeti.com]
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: sebeti-db, property: connectionString }
      - key: APP_URL
        value: https://app.7sebeti.com
      - key: API_URL
        value: https://api.7sebeti.com
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: DATA_MASTER_KEY
        sync: false

  - type: worker
    name: sebeti-worker
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @7sebeti/worker build
    startCommand: node apps/worker/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: sebeti-db, property: connectionString }
      - key: DATA_MASTER_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
