# FALLBACK only — the beta runs on Azure France Central, then Scaleway Paris (docs/deploy.md).
# Render Blueprint using the same Docker image: API + worker + Postgres in Frankfurt.
databases:
  - name: sebeti-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: '17'

services:
  - type: web
    name: sebeti-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: entrypoint api
    preDeployCommand: entrypoint migrate
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    domains: [api.7sebeti.com]
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: sebeti-db, property: connectionString }
      - key: APP_URL
        value: https://app.7sebeti.com
      - key: API_URL
        value: https://api.7sebeti.com
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: DATA_MASTER_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false

  - type: worker
    name: sebeti-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: entrypoint worker
    plan: starter
    region: frankfurt
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: sebeti-db, property: connectionString }
      - key: DATA_MASTER_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
