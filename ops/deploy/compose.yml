# Production stack on one small VM: Azure France Central during the beta (1 GB RAM), then
# Scaleway Paris (docs/deploy.md). The database is the provider's managed PostgreSQL 17 on
# the private network. Nothing here is provider-specific. Usage (on the VM, in this folder):
#   docker compose pull && docker compose up -d
# A second copy with COMPOSE_PROJECT_NAME=hsebeti-staging and its own .env runs staging.
name: ${COMPOSE_PROJECT_NAME:-hsebeti}

x-app: &app
  image: ghcr.io/bouhmid119/7sebeti:${IMAGE_TAG:-latest}
  env_file: .env
  environment:
    # Sized for a 1 GB VM: keep the V8 heap well under the container limit.
    NODE_OPTIONS: --max-old-space-size=${NODE_HEAP_MB:-160}
  # Optional CA for providers with a private one (set DATABASE_CA_CERT_FILE=/run/secrets/certs/db-ca.pem).
  volumes:
    - ./certs:/run/secrets/certs:ro
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: '3' }

services:
  migrate:
    <<: *app
    command: migrate
    restart: 'no'

  api:
    <<: *app
    command: api
    depends_on:
      migrate: { condition: service_completed_successfully }
    mem_limit: ${API_MEM_LIMIT:-256m}
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    command: worker
    depends_on:
      migrate: { condition: service_completed_successfully }
    mem_limit: ${WORKER_MEM_LIMIT:-256m}

  backup:
    build: ../backup
    env_file: .env
    # pg_dump verifies the database certificate: system roots by default (Azure), or a CA
    # file from ./certs for providers with a private CA (PGSSLROOTCERT in .env).
    environment:
      PGSSLMODE: ${PGSSLMODE:-verify-full}
      PGSSLROOTCERT: ${PGSSLROOTCERT:-system}
    volumes:
      - ./certs:/run/secrets/certs:ro
    mem_limit: 128m
    restart: unless-stopped
    profiles: [backup]

  caddy:
    image: caddy:2
    restart: unless-stopped
    mem_limit: 64m
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.7sebeti.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    profiles: [edge]

volumes:
  caddy_data:
  caddy_config:
